name: Benchmark Compiler Compare

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build and benchmark"
        required: true
        default: "main"
      benchmark_filter:
        description: "Regex passed to --benchmark_filter"
        required: false
        default: ".*"
      repetitions:
        description: "Repetitions per benchmark (--benchmark_repetitions)"
        required: false
        default: "5"

jobs:
  compare:
    name: GCC vs Clang @ ${{ inputs.ref }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runners ship both GCC and upstream Clang, so a single ref can
        # be built with each toolchain and compared. macOS/Windows are
        # excluded: macOS has no gcc (only Apple Clang), and Windows has no
        # native gcc/clang pair to compare against MSVC.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev gcc g++ clang

      - name: Install Python packages
        run: python -m pip install --quiet numpy scipy

      - name: Report toolchain versions
        run: |
          gcc --version | head -1
          clang --version | head -1

      # Each compiler gets its own build tree (including its own FetchContent
      # deps) so GCC and Clang never share generated build files for the same
      # dependency - mixing those in place has caused stale/mismatched
      # compiler state before.
      - name: Build & run benchmark - GCC
        run: |
          set -euo pipefail
          CC=gcc CXX=g++ cmake -B build-gcc -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=ON \
            -DBUILD_TESTING=OFF
          cmake --build build-gcc --target dsas_benchmark -j
          ./build-gcc/dsas_benchmark \
            --benchmark_filter="${{ inputs.benchmark_filter }}" \
            --benchmark_repetitions="${{ inputs.repetitions }}" \
            --benchmark_report_aggregates_only=true \
            --benchmark_out=gcc-result.json \
            --benchmark_out_format=json

      - name: Build & run benchmark - Clang
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ cmake -B build-clang -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=ON \
            -DBUILD_TESTING=OFF
          cmake --build build-clang --target dsas_benchmark -j
          ./build-clang/dsas_benchmark \
            --benchmark_filter="${{ inputs.benchmark_filter }}" \
            --benchmark_repetitions="${{ inputs.repetitions }}" \
            --benchmark_report_aggregates_only=true \
            --benchmark_out=clang-result.json \
            --benchmark_out_format=json

      - name: Compare results
        run: |
          set -euo pipefail
          {
            echo "## Benchmark comparison (${{ matrix.os }}) @ \`${{ inputs.ref }}\`: GCC (A) vs Clang (B)"
            echo
            echo '```text'
            python build-gcc/_deps/benchmark-src/tools/compare.py \
              --no-color -a benchmarks \
              gcc-result.json clang-result.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-compiler-compare-${{ github.run_id }}-${{ matrix.os }}
          path: |
            gcc-result.json
            clang-result.json
          retention-days: 90
